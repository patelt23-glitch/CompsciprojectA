{% extends 'base.html' %}

{% block title %}{{ error_title|default:"Assessment Notice" }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 4rem auto; padding: 3rem 2rem; text-align: center; box-shadow: var(--shadow-lg);">
  <div style="width: 60px; height: 60px; border-radius: 50%; background: #fffbeb; color: var(--warning); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>

  <h2 style="font-size: 1.6rem; margin-bottom: 0.75rem;">{{ error_title }}</h2>
  <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2rem;">
    {{ error_message }}
  </p>

  <a href="/" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
