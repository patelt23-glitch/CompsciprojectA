{% load static %}

<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Visuospatial card matching assessment frontend prototype."
  >

  <title>
    Visuospatial Assessment
  </title>

  <link
    rel="stylesheet"
    href="{% static 'app.css' %}"
  >

  <script
    src="{% static 'state.js' %}"
    defer
  ></script>

  <script
    src="{% static 'game.js' %}"
    defer
  ></script>

  <script
    src="{% static 'views.js' %}"
    defer
  ></script>

  <script
    src="{% static 'app.js' %}"
    defer
  ></script>
</head>

<body>

  <a
    class="skip"
    href="#main"
  >
    Skip to content
  </a>


  <header>

    <a
      class="brand"
      href="#home"
      aria-label="Visuospatial Assessment home"
    >

      <span
        class="brand-icon"
        aria-hidden="true"
      >
        ▦
      </span>

      <span class="brand-text">

        <strong>
          Visuospatial
        </strong>

        <span class="brand-sub">
          Assessment
        </span>

      </span>

    </a>


    <nav aria-label="Main navigation">

      <a href="#home">
        Home
      </a>

      <a href="#about">
        About
      </a>

      <a
        id="profile-nav"
        href="#profile"
        class="hidden"
      >
        Profile
      </a>

      <a
        id="login-nav"
        class="nav-login"
        href="#login"
      >
        Clinician login ↗
      </a>

    </nav>

  </header>


  <main
    id="main"
    tabindex="-1"
  ></main>


  <footer>

    <span>
      Visuospatial Assessment
    </span>

    <span>
      Frontend preview · No clinical data is submitted
    </span>

  </footer>

</body>
</html>
